[project]
name = "filinglens"
version = "0.1.0"
description = "An AI analyst for SEC filings: cited Q&A, year-over-year diffs, tool-computed financials, and Lazy Prices research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14",
    "edgartools>=3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "pandas>=2.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
research = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pandas-datareader>=0.10",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
]
frontend = ["streamlit>=1.38"]
local-embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
filinglens = "filinglens.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["edgar.*", "pgvector.*", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Heavy ML stacks: don't type-check into torch/transformers.
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test hits a real external service (deselect with -m 'not network')",
    "db: test needs Postgres+pgvector; set FILINGLENS_TEST_DATABASE_URL to run it",
]
