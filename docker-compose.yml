services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: filinglens
      POSTGRES_DB: filinglens
    ports:
      - "5433:5432"  # 5433 on the host avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://filinglens:filinglens@db:5432/filinglens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      FILINGLENS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"

volumes:
  pgdata:
