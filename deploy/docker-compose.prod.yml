# Option C (small VPS): docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# Caddy terminates HTTPS for $DOMAIN (frontend) and api.$DOMAIN (API). Only 80/443 are public.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped

  api:
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://filinglens:${POSTGRES_PASSWORD}@db:5432/filinglens
      API_TRUST_PROXY: "true"
      API_CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}
    restart: unless-stopped

  frontend:
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, api]
    restart: unless-stopped

volumes:
  caddy_data:
